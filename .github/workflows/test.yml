name: Python Tests

on:
  push:
   branches: [ main ]


jobs:
 test:
   runs-on: ubuntu-latest

   steps:
   -uses: actions/checkout@v3
   -name: Set up Python
   -uses: nano .github/workflows/test.yml
   with:
    python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
    - name: Run tests
      run: |
        pytest -v

